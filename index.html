<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life's Legacy Blueprint (LLB)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col justify-between">
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-900">Life's Legacy Blueprint</h1>
            <div id="auth-status" class="text-sm font-medium text-gray-600">Not signed in</div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-12 flex-grow w-full">
        <div class="bg-white shadow rounded-lg p-8 border border-gray-200">
            <h2 class="text-2xl font-semibold mb-2 text-gray-800">Platform Access</h2>
            <p class="text-gray-600 mb-6">Secure end-to-end estate planning, secure vault storage, and professional roster assignments.</p>
            
            <div id="login-container" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button id="login-btn" class="w-full bg-blue-900 text-white font-medium py-2 rounded-lg hover:bg-blue-800 transition">Send Magic Link</button>
            </div>
            <div id="message" class="mt-4 text-sm font-medium"></div>

            <div id="nav-modules" class="mt-8 hidden border-t border-gray-200 pt-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-3">Your Legacy Modules</h3>
                <ul class="space-y-2">
                    <li>
                        <a href="modules/module-1.html" class="text-blue-900 hover:underline font-medium flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200 hover:border-blue-300 transition">
                            <span>Module 1.0: Personal & Estate Foundation</span>
                            <span>→</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500">
        © 2026 Griffin Property and Holdings LLC. All rights reserved.
    </footer>

    <script type="module">
        import { supabase } from './js/supabase-config.js';

        const loginBtn = document.getElementById('login-btn');
        const emailInput = document.getElementById('email');
        const messageDiv = document.getElementById('message');
        const authStatus = document.getElementById('auth-status');
        const navModules = document.getElementById('nav-modules');
        const loginContainer = document.getElementById('login-container');

        // Check active session on load
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                authStatus.textContent = `Signed in: ${session.user.email}`;
                loginContainer.innerHTML = `<p class="text-green-600 font-medium">You are securely authenticated.</p>`;
                navModules.classList.remove('hidden');
            }
        }
        checkSession();

        // Handle Magic Link Login
        loginBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            if (!email) {
                messageDiv.textContent = 'Please enter a valid email address.';
                messageDiv.className = 'mt-4 text-sm font-medium text-red-600';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Sending link...';

            const { error } = await supabase.auth.signInWithOtp({ 
                email,
                options: {
                    emailRedirectTo: 'https://griffinjtravis78.github.io/LLBProduction/'
                }
            });

            if (error) {
                messageDiv.textContent = error.message;
                messageDiv.className = 'mt-4 text-sm font-medium text-red-600';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Send Magic Link';
            } else {
                messageDiv.textContent = 'Check your email for the login link!';
                messageDiv.className = 'mt-4 text-sm font-medium text-green-600';
            }
        });
    </script>
</body>
</html>
